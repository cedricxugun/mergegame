<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f5e9">
  <meta name="description" content="风暴之后，带着家人回到故乡。通过三消获得材料，在六边形地图上合成，逐步修复营地、溪流与渡口。">
  <title>风暴之后 · 归乡手记</title>
  <link rel="icon" href="./assets/storm-roof.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./homecoming.css">
  <link rel="stylesheet" href="./match3-premium.css">
</head>
<body>
  <main id="homecoming" class="phone-shell">
    <header class="camp-header"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 16 12-10 12 10M7 14v13h18V14M13 27v-9h6v9M22 6v5"/><path d="M6 5 3 8M12 2l-2 3" stroke="#a5b59b"/></svg></span><div class="brand-text"><span id="eyebrow">风暴之后 · 归乡手记</span><h1 id="region-title">林间营地</h1></div><button id="sound" class="icon-button" aria-label="开启音效"></button><button id="settings" class="icon-button" aria-label="设置与重新体验"></button></header>
    <button id="story-card" class="story-card" aria-label="打开归乡手记"><img id="story-avatar" src="./assets/storm-mira.svg" alt=""><div class="story-copy"><strong id="story-speaker">米拉</strong><p id="story-line">莉娜，先把漏雨的棚顶补好。今晚，我们就在这里安顿下来。</p></div><span class="story-book"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 3h14v18H4a2 2 0 0 1 0-4h14M7 7h7M7 11h5"/></svg><span id="journal-count">0/10</span></span></button>
    <nav id="station-nav" class="station-nav" aria-label="切换地图区域"></nav>
    <button id="task-card" class="task-card" aria-label="查看当前修复任务"><div class="task-content"><img id="task-art" alt=""><div class="task-copy"><div class="task-top"><strong id="task-title">先补好漏雨的棚顶</strong><span id="task-stage">0 / 4</span></div><div class="task-bottom"><span id="task-need"></span><small id="task-value"></small></div><div class="task-track"><span id="task-meter"></span></div></div></div><div id="workflow" class="workflow" aria-label="当前操作步骤"></div></button>
    <section class="map-wrap" aria-label="共用六边形地图"><div class="map-caption"><span id="space-count"></span><span id="map-status"></span></div><svg id="map" role="group" aria-label="林间营地六边形合成地图"></svg><button id="supply-crate" class="supply-crate" hidden aria-label="打开待领物资箱"><img src="./assets/chest.svg" alt=""><span>打开物资 <b id="supply-pending"></b></span></button><div id="repair-result" class="repair-result" role="status" aria-live="polite" hidden></div><div id="notice" class="notice" role="status" aria-live="polite" hidden></div><div id="drag-note" class="drag-note" aria-live="polite"></div><div class="map-controls"><button id="undo" aria-label="撤销上一步"></button><button id="hint" aria-label="提示下一步"></button><button id="recenter" aria-label="视角回到当前区域中心"></button></div><button id="world" class="world-button" aria-label="切换故乡全景"></button></section>
    <section id="inspector" class="inspector" aria-live="polite"></section>
    <div class="action-area"><button id="primary" class="primary"><span class="primary-symbol" aria-hidden="true">✦</span><span><strong id="primary-label">开始第 1 关</strong><small id="primary-detail">三消通关得素材箱 · 林间营地 1 / 8</small></span></button><button id="cancel" class="text-button" hidden>取消预览，素材留在原位</button><button id="extra-win" class="text-button" hidden>先玩下一关三消，继续攒物资</button></div>
    <section id="tray" class="tray" aria-label="素材暂放区" hidden><button id="tray-toggle" aria-expanded="true">暂放区 <b id="tray-count"></b><span>点素材取回 · 可直接合成和交付</span></button><div id="tray-items" class="tray-items"></div></section>
    <footer><span id="save-status">进度自动保存</span><span id="supply-count">旅途补给 0</span></footer>
  </main>
  <section id="match-screen" class="match-screen" aria-label="三消关卡" hidden></section>
  <dialog id="dialog"><div id="dialog-body"></div></dialog>
  <script type="module" src="./homecoming-app.mjs"></script>
</body>
</html>
