    <a class="card" href="./a/index.html"><img src="../assets/lite/chest.webp" alt=""><span><strong>A · 三消 + 轻合成</strong><small>三消是主玩法，30 个本作关卡。通关带回物资箱，一点开箱，低级材料自动连锁合成；把成品拖到工地修好故乡。修复解锁关前道具、额外步数和更多材料。</small><b>30 关</b><b>17 处修复</b><b>8 页手记</b></span></a>
